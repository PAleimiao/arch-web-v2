<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面走丢了 · Arch Web OS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        color: #c7d1e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
      }
      .code {
        font-size: 64px;
        font-weight: 200;
        letter-spacing: 4px;
        color: #1793d1;
      }
      .msg {
        font-size: 13px;
        opacity: 0.7;
      }
      a {
        margin-top: 8px;
        padding: 8px 20px;
        border: 1px solid #1793d1;
        border-radius: 6px;
        color: #1793d1;
        text-decoration: none;
        font-size: 13px;
      }
      a:hover {
        background: rgba(23, 147, 209, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <div class="msg">这个路径没有页面，正在带你回桌面…</div>
      <a id="go" href="/">返回 Arch Web OS</a>
    </div>
    <script>
      // 同一份 404 页面要适配两种部署：
      //  - GitHub Pages 项目站：base=/arch-web-v2，回 /arch-web-v2/
      //  - Cloudflare 自定义域：base=/，回 /
      // 用当前路径里是否含 /arch-web-v2 判断，兼容子路径与根路径。
      (function () {
        var href = window.location.pathname || "";
        var home = href.indexOf("/arch-web-v2") !== -1 ? "/arch-web-v2/" : "/";
        var link = document.getElementById("go");
        if (link) link.href = home;
        setTimeout(function () {
          window.location.replace(home);
        }, 1200);
      })();
    </script>
  </body>
</html>
